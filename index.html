<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotels &amp; Resorts — Qamru Travel (replica)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.qf-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.qf-rate{background:var(--trust);color:#fff;font-weight:800;font-size:11.5px;border-radius:6px;padding:1px 6px}
.qf-night{font-size:11px;color:var(--muted);display:block;font-weight:600}
.qf-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.qf-tools select,.qf-tools input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
.qf-tools input{flex:1;min-width:200px}
.qf-shot::before{padding-top:75%}
.qf-card .qf-ctitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#modal{position:fixed;inset:0;background:rgba(14,30,74,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--sh-md)}
.mgal{display:grid;grid-template-columns:2fr 1fr;gap:4px}
.mgal img{width:100%;height:100%;object-fit:cover;display:block}
.mgal .big{grid-row:span 3;min-height:300px}
.mgal .sm{height:100px}
.mbody{padding:20px}
.mbody h2{font-family:var(--serif);font-size:26px;margin-bottom:6px}
.mclose{float:right;border:0;background:var(--sky);border-radius:99px;width:34px;height:34px;font-size:20px}
.mprice{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--navy);margin:14px 0}
.empty{padding:40px;text-align:center;color:var(--muted)}
.bstep{display:flex;gap:6px;margin:0 0 16px;font-size:12px;font-weight:700;color:var(--muted)}
.bstep span{flex:1;padding:6px 0;border-bottom:3px solid var(--line);text-align:center}.bstep .on{color:var(--navy);border-color:var(--gold)}
.bf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.bf label{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.bf input,.bf select,.bf textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.bf .full{grid-column:1/-1}.bf .err{border-color:#C62828}
.bsum{background:var(--sky);border-radius:12px;padding:14px;margin:12px 0;font-size:14px}
.bsum div{display:flex;justify-content:space-between;padding:3px 0}.bsum .tot{font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.bbtn{background:var(--navy);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:800;font-size:15px;width:100%;margin-top:8px}
.bbtn.sec{background:var(--sky);color:var(--navy)}
.bpay label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:14px;color:var(--ink);font-weight:600}
.bpay input{width:auto;margin:0}.bok{text-align:center;padding:10px 0}.bok .tick{width:60px;height:60px;border-radius:50%;background:var(--trust);color:#fff;font-size:34px;line-height:60px;margin:0 auto 10px}
.bref{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:700}
@media(max-width:560px){.bf{grid-template-columns:1fr}.mgal{grid-template-columns:1fr}.mgal .big{grid-row:auto;min-height:200px}.mgal .sm{display:none}}
</style></head><body>
<div class="qf-topbar"><div class="qf-wrap">
 <span class="qf-tl">Halal-friendly hotels &amp; resorts · worldwide</span>
 <span class="qf-tr"><a href="#" id="mybk">My bookings</a><label class="qf-ccy"><select id="ccy" aria-label="Display currency"><option>PKR</option><option>USD</option><option>MYR</option><option>GBP</option><option>EUR</option><option>AED</option><option>SAR</option></select></label></span>
</div></div>
<header class="qf-logorow"><div class="qf-wrap">
 <a class="qf-logo" href="./"><span class="qf-mark"><svg viewBox="0 0 100 100" width="34" height="34"><defs><linearGradient id="qfmk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE9F8"/><stop offset="1" stop-color="#8FB4DE"/></linearGradient></defs><rect x="2" y="2" width="96" height="96" rx="26" fill="url(#qfmk)"/><circle cx="50" cy="52" r="26" fill="none" stroke="#16294A" stroke-width="9"/><circle cx="50" cy="52" r="7" fill="#16294A"/><circle cx="73" cy="30" r="10" fill="#F0A63A" stroke="#16294A" stroke-width="4"/></svg></span><span class="qf-word"><b>Qamru</b><span>Travel</span></span></a>
 <form class="qf-search" onsubmit="return false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" type="search" placeholder="Search hotels, resorts, cities…" autocomplete="off"></form>
</div></header>
<a class="qf-salebar" href="#catalog"><span class="qf-sale-shine"></span><span class="qf-wrap qf-sale-in">
 <span class="qf-sale-eyebrow"><span>Hotels&nbsp;&amp;&nbsp;Resorts</span></span>
 <span class="qf-sale-head"><b class="qf-sale-pct" id="cnt"></b><span class="qf-sale-note">halal-friendly stays, prices per night</span></span>
 <span class="qf-sale-cta">Browse stays</span></span></a>
<main class="qf-wrap" style="padding-top:24px;padding-bottom:48px">
 <div id="catalog"></div>
 <div class="qf-shead"><span class="qf-label"><b>Hotels &amp; Resorts</b><span>Handpicked stays</span></span><span class="qf-subhead">Hotels, resorts and villas with halal-friendly facilities</span></div>
 <div class="qf-tools"><select id="country"><option value="">All countries</option></select>
  <select id="sort"><option value="">Featured</option><option value="pa">Price: low to high</option><option value="pd">Price: high to low</option><option value="r">Top rated</option></select></div>
 <div class="qf-grid" id="grid"></div>
</main>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<script src="hotels.js"></script>
<script>
var RATE={USD:1,PKR:280,MYR:4.7,GBP:.78,EUR:.92,AED:3.67,SAR:3.75},H=window.HOTELS;
var CN={BR:'Brazil',TR:'Turkey',MV:'Maldives',MA:'Morocco',SA:'Saudi Arabia',ES:'Spain',CA:'Canada',EG:'Egypt',GR:'Greece',PT:'Portugal',ID:'Indonesia',MX:'Mexico',OM:'Oman',GB:'United Kingdom',MT:'Malta',FR:'France',TH:'Thailand',BA:'Bosnia and Herzegovina',QA:'Qatar',IT:'Italy',MY:'Malaysia',CH:'Switzerland',AE:'United Arab Emirates'};
H.forEach(function(h){h.c=CN[h.c]||h.c});
var $=function(i){return document.getElementById(i)};
function fmt(usd){var c=$('ccy').value;return c+' '+Math.round(usd*RATE[c]).toLocaleString('en-US')}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
[...new Set(H.map(function(h){return h.c}).filter(Boolean))].sort().forEach(function(c){$('country').insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>')});
function list(){
  var q=$('q').value.toLowerCase(),c=$('country').value,s=$('sort').value;
  var r=H.filter(function(h){return(!c||h.c===c)&&(!q||(h.n+' '+h.l+' '+h.c).toLowerCase().indexOf(q)>-1)});
  if(s==='pa')r.sort(function(a,b){return a.p-b.p});if(s==='pd')r.sort(function(a,b){return b.p-a.p});
  if(s==='r')r.sort(function(a,b){return(b.r||0)-(a.r||0)});
  return r}
function render(){
  var r=list();$('cnt').textContent=r.length+' stays';
  $('grid').innerHTML=r.length?r.map(function(h){return '<article class="qf-card"><a class="qf-shot" href="#" data-id="'+h.id+'" style="display:block"><img class="qf-shot-img" src="'+h.i[0]+'" alt="'+esc(h.n)+'" loading="lazy"></a><div class="qf-cbody"><a class="qf-ctitle" href="#" data-id="'+h.id+'">'+esc(h.n)+'</a><div class="qf-meta">'+(h.r?'<span class="qf-rate">'+h.r+'</span>':'')+'<span>'+esc((h.l?h.l.split(',').pop().trim()+', ':'')+h.c)+'</span></div><div class="qf-cfoot"><div class="qf-pricewrap"><span class="qf-price">'+fmt(h.p)+'<span class="qf-night">per night, from</span></span></div></div></div></article>'}).join(''):'<div class="empty" style="grid-column:1/-1">No hotels found.</div>'}
var ROOMS={Standard:1,Deluxe:1.25,Suite:1.6},B={};
function today(n){var d=new Date();d.setDate(d.getDate()+(n||0));return d.toISOString().slice(0,10)}
function nights(){return Math.max(1,Math.round((new Date(B.out)-new Date(B.in))/864e5))}
function calc(){var base=B.h.p*ROOMS[B.room]*nights()*B.rooms;return{base:base,tax:base*.1,tot:base*1.1}}
function steps(n){return '<div class="bstep">'+['Stay','Guest','Payment','Done'].map(function(t,i){return '<span class="'+(i+1===n?'on':'')+'">'+(i+1)+'. '+t+'</span>'}).join('')+'</div>'}
function summ(){var c=calc();return '<div class="bsum"><div><span>'+esc(B.room)+' room × '+B.rooms+' × '+nights()+' night(s)</span><span>'+fmt(c.base)+'</span></div><div><span>Taxes &amp; fees (10%)</span><span>'+fmt(c.tax)+'</span></div><div class="tot"><span>Total</span><span>'+fmt(c.tot)+'</span></div></div>'}
function shell(n,html,h){var g=h.i;$('mbox').innerHTML='<div class="mgal"><img class="big" src="'+g[0]+'" alt="">'+g.slice(1).map(function(s){return '<img class="sm" src="'+s+'" alt="">'}).join('')+'</div><div class="mbody"><button class="mclose" onclick="closeM()">×</button><h2>'+esc(h.n)+'</h2><div class="qf-meta">'+(h.r?'<span class="qf-rate">'+h.r+'</span><span>'+h.rv+' reviews</span>':'')+'<span>'+esc(h.l)+', '+esc(h.c)+'</span></div>'+steps(n)+html+'</div>';$('mbox').scrollTop=0}
function closeM(){$('modal').classList.remove('on')}
function open_(id){var h=H.filter(function(x){return x.id===id})[0];B={h:h,in:today(7),out:today(9),rooms:1,adults:2,room:'Standard',pay:'hotel'};step1();$('modal').classList.add('on')}
function step1(){var h=B.h;shell(1,'<p>'+esc(h.d)+'</p><div class="mprice">'+fmt(h.p)+' <span class="qf-night" style="display:inline">/ night, from</span></div><div class="bf"><label>Check-in<input type="date" id="bin" min="'+today(0)+'" value="'+B.in+'"></label><label>Check-out<input type="date" id="bout" value="'+B.out+'"></label><label>Room type<select id="broom">'+Object.keys(ROOMS).map(function(r){return '<option'+(r===B.room?' selected':'')+'>'+r+'</option>'}).join('')+'</select></label><label>Rooms<select id="brooms">'+[1,2,3,4].map(function(n){return '<option'+(n===B.rooms?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label><label class="full">Adults<select id="badults">'+[1,2,3,4,5,6].map(function(n){return '<option'+(n===B.adults?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label></div><div id="s1sum"></div><button class="bbtn" id="n1">Continue</button>',h);
  function upd(){B.in=$('bin').value;B.out=$('bout').value;B.room=$('broom').value;B.rooms=+$('brooms').value;B.adults=+$('badults').value;if(B.out<=B.in){var d=new Date(B.in);d.setDate(d.getDate()+1);B.out=d.toISOString().slice(0,10);$('bout').value=B.out}$('bout').min=B.in;$('s1sum').innerHTML=summ()}
  ['bin','bout','broom','brooms','badults'].forEach(function(i){$(i).addEventListener('change',upd)});upd();$('n1').onclick=function(){upd();step2()}}
function step2(){var g=B.g||{};shell(2,'<div class="bf"><label>Full name<input id="gn" value="'+esc(g.n)+'"></label><label>Email<input id="ge" type="email" value="'+esc(g.e)+'"></label><label>Phone<input id="gp" value="'+esc(g.p)+'"></label><label>Country<input id="gc" value="'+esc(g.c)+'"></label><label class="full">Special requests (optional)<textarea id="gs" rows="2">'+esc(g.s)+'</textarea></label></div><button class="bbtn" id="n2">Continue to payment</button><button class="bbtn sec" id="b2">Back</button>',B.h);
  $('b2').onclick=step1;$('n2').onclick=function(){var ok=true;[['gn',function(v){return v.trim().length>1}],['ge',function(v){return /^\S+@\S+\.\S+$/.test(v)}],['gp',function(v){return v.replace(/\D/g,'').length>=7}]].forEach(function(f){var el=$(f[0]),good=f[1](el.value);el.classList.toggle('err',!good);if(!good)ok=false});B.g={n:$('gn').value,e:$('ge').value,p:$('gp').value,c:$('gc').value,s:$('gs').value};if(ok)step3()}}
function step3(){var P={hotel:'Pay at the hotel (no payment now)',bank:'Bank transfer — instructions sent by email',cash:'Pay on arrival in cash'};shell(3,'<div class="bsum"><div><span>'+esc(B.in)+' → '+esc(B.out)+'</span><span>'+nights()+' night(s)</span></div><div><span>Guest</span><span>'+esc(B.g.n)+'</span></div><div><span>Adults</span><span>'+B.adults+'</span></div></div>'+summ()+'<div class="bpay">'+Object.keys(P).map(function(k){return '<label><input type="radio" name="pay" value="'+k+'"'+(k===B.pay?' checked':'')+'>'+P[k]+'</label>'}).join('')+'</div><button class="bbtn" id="n3">Confirm booking</button><button class="bbtn sec" id="b3">Back</button>',B.h);
  $('b3').onclick=step2;$('n3').onclick=function(){B.pay=document.querySelector('input[name=pay]:checked').value;var c=calc(),ref='QT'+Date.now().toString(36).toUpperCase().slice(-6);var rec={ref:ref,hotel:B.h.n,id:B.h.id,in:B.in,out:B.out,nights:nights(),room:B.room,rooms:B.rooms,adults:B.adults,guest:B.g,pay:P[B.pay],usd:c.tot,at:new Date().toISOString()};try{var l=JSON.parse(localStorage.getItem('qt_bookings')||'[]');l.unshift(rec);localStorage.setItem('qt_bookings',JSON.stringify(l))}catch(e){}step4(rec)}}
function step4(r){shell(4,'<div class="bok"><div class="tick">✓</div><h3>Booking confirmed</h3><p>Reference</p><div class="bref">'+r.ref+'</div><p style="color:var(--muted);font-size:13px;margin-top:6px">Confirmation for '+esc(r.guest.e)+'</p></div><div class="bsum"><div><span>Dates</span><span>'+esc(r.in)+' → '+esc(r.out)+'</span></div><div><span>Room</span><span>'+esc(r.room)+' × '+r.rooms+'</span></div><div><span>Payment</span><span>'+esc(r.pay)+'</span></div><div class="tot"><span>Total</span><span>'+fmt(r.usd)+'</span></div></div><button class="bbtn" onclick="window.print()">Print / save confirmation</button><button class="bbtn sec" onclick="closeM()">Close</button>',H.filter(function(x){return x.id===r.id})[0])}
$('mybk').addEventListener('click',function(e){e.preventDefault();var l=[];try{l=JSON.parse(localStorage.getItem('qt_bookings')||'[]')}catch(x){}
  $('mbox').innerHTML='<div class="mbody"><button class="mclose" onclick="closeM()">×</button><h2>My bookings</h2>'+(l.length?l.map(function(r){return '<div class="bsum"><div><b>'+esc(r.hotel)+'</b><span>'+r.ref+'</span></div><div><span>'+esc(r.in)+' → '+esc(r.out)+' · '+esc(r.room)+' × '+r.rooms+'</span><span>'+fmt(r.usd)+'</span></div></div>'}).join(''):'<p class="empty">No bookings yet.</p>')+'</div>';$('modal').classList.add('on')});
$('grid').addEventListener('click',function(e){var a=e.target.closest('[data-id]');if(a){e.preventDefault();open_(a.dataset.id)}});
$('modal').addEventListener('click',function(e){if(e.target.id==='modal')$('modal').classList.remove('on')});
['q','country','sort','ccy'].forEach(function(i){$(i).addEventListener('input',render)});
render();
</script></body></html>
